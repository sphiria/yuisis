worker_processes auto;
error_log stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main_res '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for" '
    '$request_time $upstream_response_time $pipe $upstream_cache_status';

    error_log stderr warn;
    access_log /dev/stdout main_res;

    tcp_nopush on;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 32 16k;
    gzip_http_version 1.1;
    gzip_min_length 250;
    gzip_types image/jpeg image/bmp image/svg+xml text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/x-icon;

    client_body_timeout 60;
    client_header_timeout 60;
    keepalive_timeout 65;
    send_timeout 120;
    fastcgi_read_timeout 120;

    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_max_body_size 15M;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  131.0.72.0/22;
    set_real_ip_from  2400:cb00::/32;
    set_real_ip_from  2606:4700::/32;
    set_real_ip_from  2803:f800::/32;
    set_real_ip_from  2405:8100::/32;
    set_real_ip_from  2a06:98c0::/29;
    set_real_ip_from  2c0f:f248::/32;
    set_real_ip_from  2405:b500::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    server {
        listen 8080;
        server_name gbf.wiki;
        sendfile off;
        absolute_redirect off;

        root /var/www/html;
        index index.php;

        location /robots.txt { 
            alias /var/www/html/robots.txt;
        }

        location /favicon.ico {
            alias /var/www/html/favicon.ico;
        }

        location ~ ^/(fpm-status|fpm-ping)$ {
            access_log off;
            allow 10.0.0.0/8;
            deny all;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/var/run/php-fpm.sock;
        }

        location /rest.php {
            try_files $uri $uri/ /rest.php?$args;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME	$document_root/rest.php;
    		fastcgi_pass unix:/var/run/php-fpm.sock;
        }

    	location / {
    		try_files $uri $uri/ @mediawiki;
    		location ~ \.php$ {
    			try_files $uri $uri/ =404;
    			include fastcgi_params;
    			fastcgi_pass unix:/var/run/php-fpm.sock;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    		}
    	}

        location @thumb {
            rewrite ^/images/thumb/([0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/[^/]*([0-9]+)px-.*)$ /thumb_handler.php/$1;
            rewrite ^/images/thumb/(archive/[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/[^/]*([0-9]+)px-.*)$ /thumb_handler.php/$1;
        }

        location ~ ^/Images/(.*) {
            return 301 /images/$1;
        }

    	location /images {
                alias /mnt/images;
    		    location ~ ^/images/thumb/(webp/)?(archive/)?[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/([0-9]+)px-.*$ {
                    expires 2h;
                    add_header 'Access-Control-Allow-Origin' 'gbf.wiki' always;
                    add_header Cache-Control "public, no-transform";
                    add_header X-XSS-Protection "1; mode=block";
                    try_files $uri $uri/ @thumb;
    		    }
    	}

        location ~* /(?:docs|extensions|includes|cache|languages|maintenance|mw-config|serialized|skins|tests|vendor|images)/.*.php$ {
            deny all;
        }

        location ~ /.(svn|git|.ht)(/|$) {
            deny all;
        }

    	# thumbnails
    	location @thumb {
            rewrite ^/images/thumb/webp/[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/([0-9]+)px-.*$ /thumb.php?f=$1&width=$2&archived=1;
    		rewrite ^/images/thumb/[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/([0-9]+)px-.*$ /thumb.php?f=$1&width=$2;
            rewrite ^/images/thumb/archive/[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/([0-9]+)px-.*$ /thumb.php?f=$1&width=$2&archived=1;
    		include fastcgi_params;
    		fastcgi_param SCRIPT_FILENAME	$document_root/thumb.php;
    		fastcgi_pass unix:/var/run/php-fpm.sock;
    	}

        # mediawiki
        location @mediawiki {
    		include fastcgi_params;
    		fastcgi_param SCRIPT_FILENAME	$document_root/index.php;
    		fastcgi_pass unix:/var/run/php-fpm.sock;
    	}
    }
}