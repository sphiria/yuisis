name: build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: yuisis-release
  queue: max

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: build and push
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          else
            tag=$(git tag --points-at HEAD --sort=-version:refname | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {p;q;}')
            if [[ -z "$tag" ]]; then
              latest=$(git tag --sort=-version:refname | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {p;q;}')
              IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
              tag="$major.$minor.$((10#$patch + 1))"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.tag }}

      - name: Create release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --generate-notes
          fi
