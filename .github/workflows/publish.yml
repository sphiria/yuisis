name: publish

on: [push]

jobs:
  publish-yusis-image:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: build yuisis image
      run: |
        docker build . --tag ghcr.io/sphiria/yuisis:$(git rev-parse --short HEAD)" --tag ghcr.io/sphiria/yuisis:latest
        docker push ghcr.io/sphiria/yuisis:$(git rev-parse --short HEAD)"
        docker push ghcr.io/sphiria/yuisis:latest